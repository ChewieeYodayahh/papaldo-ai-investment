name: Claude Code Security Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: Security review
    runs-on: ubuntu-latest

    # Trusted PRs only. A pull request from a fork must never reach the
    # CLAUDE_API_KEY secret, and pull_request (not pull_request_target) already
    # runs fork code without secrets -- this makes the intent explicit and
    # skips the job outright rather than failing it halfway through.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # The action diffs the PR against its base, so it needs full history.
          fetch-depth: 0

      - name: Run Claude Code security review
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
